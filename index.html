<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office Avatar Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/studio.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="layout">
      <section class="stage" aria-label="Avatar studio viewport">
        <canvas id="studioCanvas" aria-label="Avatar preview canvas"></canvas>
        <div class="scan" aria-hidden="true"></div>
        <div class="hud">
          <p class="eyebrow">Office Avatar Kit</p>
          <h1>Avatar Studio</h1>
          <p class="sub">Switch between Clippy, Pushy, and Tacky. Tune settings and export JSON presets.</p>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-header">
          <div class="avatar-switcher">
            <label for="avatarSelect">Avatar</label>
            <select id="avatarSelect" aria-label="Select avatar model"></select>
          </div>
          <div class="header-actions">
            <button type="button" id="btnVoice" class="btn-voice" title="Connect OpenAI realtime voice">
              Voice: Connect
            </button>
            <button type="button" id="btnElevenVoice" class="btn-voice" title="Connect ElevenLabs voice">
              EL Voice: Connect
            </button>
            <span id="status" class="status" aria-live="polite"></span>
          </div>
        </div>

        <div class="panel-scroll">
          <section class="control-group utilities">
            <h3 class="group-title">Presets</h3>
            <div class="btn-grid">
              <button type="button" id="btnReset">Reset</button>
              <button type="button" id="btnRandom">Randomize</button>
            </div>
            <div class="btn-grid">
              <button type="button" id="btnCopy">Copy JSON</button>
              <button type="button" id="btnApply">Apply JSON</button>
            </div>
          </section>

          <section class="control-group character-profile">
            <h3 class="group-title">Character Profile</h3>
            <div class="control profile-control">
              <label class="control-label" for="characterName">Character Name</label>
              <input id="characterName" type="text" maxlength="80" placeholder="e.g. Clippy Prime" />
            </div>
            <div class="control profile-control">
              <label class="control-label" for="characterBackground">Background</label>
              <textarea
                id="characterBackground"
                class="profile-textarea"
                rows="3"
                maxlength="420"
                placeholder="Who are they? What are they good at?"
              ></textarea>
            </div>
            <div class="control profile-control">
              <label class="control-label" for="characterPersonality">Personality</label>
              <textarea
                id="characterPersonality"
                class="profile-textarea"
                rows="3"
                maxlength="420"
                placeholder="How should this avatar speak and behave?"
              ></textarea>
            </div>
            <div class="profile-btn-grid">
              <button type="button" id="btnResetCharacter">Reset Profile</button>
              <button type="button" id="btnSaveCharacter">Save Character</button>
            </div>
          </section>

          <section class="control-group voice-credentials">
            <h3 class="group-title">Voice Credentials</h3>
            <p class="credential-note">Stored in this browser (localStorage).</p>
            <div class="control profile-control">
              <label class="control-label" for="openAiToken">OpenAI API Key</label>
              <input
                id="openAiToken"
                class="credential-input"
                type="password"
                autocomplete="off"
                placeholder="sk-..."
              />
            </div>
            <div class="control profile-control">
              <label class="control-label" for="elevenLabsAgentPreset">ElevenLabs Persona</label>
              <select id="elevenLabsAgentPreset" class="credential-input">
                <option value="">Custom (Manual ID)</option>
                <option value="agent_6201kh80gehme6wacehwktq31hsk">Towelie</option>
                <option value="agent_2601khypzbkje0hvtr252mmavwam">Hal9000</option>
              </select>
            </div>
            <div class="control profile-control">
              <label class="control-label" for="elevenLabsAgentId">ElevenLabs Agent ID</label>
              <input
                id="elevenLabsAgentId"
                class="credential-input"
                type="text"
                autocomplete="off"
                placeholder="agent_..."
              />
            </div>
            <div class="control profile-control">
              <label class="control-label" for="elevenLabsApiKey">ElevenLabs API Key</label>
              <input
                id="elevenLabsApiKey"
                class="credential-input"
                type="password"
                autocomplete="off"
                placeholder="sk_..."
              />
            </div>
            <div class="profile-btn-grid">
              <button type="button" id="btnSaveVoiceCredentials">Save Credentials</button>
              <button type="button" id="btnClearVoiceCredentials">Clear Stored</button>
            </div>
          </section>

          <div id="controlSections"></div>

          <section class="control-group json-output">
            <h3 class="group-title">Preset JSON</h3>
            <textarea id="presetJson" spellcheck="false" aria-label="Avatar preset JSON"></textarea>
          </section>
        </div>
      </aside>
    </div>

    <script type="module" src="./js/studio.js"></script>
  </body>
</html>
