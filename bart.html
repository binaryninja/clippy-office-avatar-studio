<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bart Simpson - Model Inspection</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #1a1a2e;
        color: #eee;
        font-family: system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 24px;
        background: #16213e;
        border-bottom: 1px solid #0f3460;
      }
      header h1 { font-size: 18px; font-weight: 600; }
      #downloadBtn {
        padding: 8px 18px;
        background: #e94560;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 600;
      }
      #downloadBtn:hover { background: #c73650; }
      #downloadBtn:disabled { opacity: 0.5; cursor: wait; }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
        padding: 2px;
        background: #0f3460;
      }
      .view {
        position: relative;
        background: #1a1a2e;
      }
      .view canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .view .label {
        position: absolute;
        top: 8px;
        left: 10px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #e94560;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        pointer-events: none;
      }
      .view .coords {
        position: absolute;
        bottom: 6px;
        right: 10px;
        font-size: 10px;
        color: #888;
        font-family: monospace;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <h1>Bart Simpson — Model Inspection Sheet</h1>
      <button id="downloadBtn">Download All Screenshots</button>
    </header>
    <div class="grid" id="grid"></div>

    <script type="module">
      import * as THREE from 'three';

      // ========================================================
      // Camera angle definitions
      // ========================================================
      const CENTER = new THREE.Vector3(0, 1.6, 0);
      const DIST = 4.5;

      const VIEWS = [
        { name: 'Front',           pos: [0, 1.6, DIST],           lookAt: CENTER },
        { name: 'Back',            pos: [0, 1.6, -DIST],          lookAt: CENTER },
        { name: 'Left Profile',    pos: [-DIST, 1.6, 0],          lookAt: CENTER },
        { name: 'Right Profile',   pos: [DIST, 1.6, 0],           lookAt: CENTER },
        { name: '3/4 Front-Left',  pos: [-3.2, 2.0, 3.2],        lookAt: CENTER },
        { name: '3/4 Front-Right', pos: [3.2, 2.0, 3.2],         lookAt: CENTER },
        { name: 'Top Down',        pos: [0, DIST + 1.6, 0.01],   lookAt: CENTER },
        { name: 'Face Close-Up',   pos: [0, 2.15, 2.2],          lookAt: new THREE.Vector3(0, 2.15, 0) },
      ];

      // ========================================================
      // Build the Bart model (returns a THREE.Group)
      // ========================================================
      function buildBart() {
        const skin = new THREE.MeshStandardMaterial({ color: 0xffd90f });
        const white = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const black = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const shirtOrange = new THREE.MeshStandardMaterial({ color: 0xff6600 });
        const shortsBlue = new THREE.MeshStandardMaterial({ color: 0x2266cc });
        const shoesBlue = new THREE.MeshStandardMaterial({ color: 0x2266cc });

        const bart = new THREE.Group();

        // ---- HEAD ----
        // Rounded LatheGeometry (organic, NOT boxy) with chin taper
        // Scaled wider (X) than deep (Z) for elliptical cross-section from top
        const HR = 0.40;       // max radius before scaling
        const HH = 0.46;       // half height
        const HEAD_Y = 2.15;
        const X_SCALE = 1.15;  // wider left-right
        const Z_SCALE = 0.82;  // narrower front-back

        const headPts = [
          // Chin — tapers inward significantly (per reference)
          new THREE.Vector2(0,    -HH),
          new THREE.Vector2(0.10, -HH + 0.01),
          new THREE.Vector2(0.20, -HH + 0.05),
          new THREE.Vector2(0.30, -HH + 0.12),
          // Jaw — curves outward toward cheeks
          new THREE.Vector2(0.36, -HH + 0.22),
          new THREE.Vector2(HR,   -HH + 0.30),
          // Main cylindrical section — full radius
          new THREE.Vector2(HR,   -HH + 0.36),
          new THREE.Vector2(HR,    HH - 0.12),
          // Top — flat with slight rounded edge
          new THREE.Vector2(HR - 0.01, HH - 0.06),
          new THREE.Vector2(HR * 0.72, HH - 0.02),
          new THREE.Vector2(HR * 0.35, HH - 0.005),
          new THREE.Vector2(0,    HH),
        ];
        const headGeo = new THREE.LatheGeometry(headPts, 32);
        const head = new THREE.Mesh(headGeo, skin);
        head.scale.set(X_SCALE, 1, Z_SCALE);
        head.position.y = HEAD_Y;
        bart.add(head);

        // Effective dimensions after scaling
        const HEAD_HALF_W = HR * X_SCALE;  // ~0.46
        const FACE_Z = HR * Z_SCALE;       // ~0.328

        // ---- HAIR SPIKES ----
        // 9 zigzag spikes (per reference model sheet), much taller
        const spikeShape = new THREE.Shape();
        const NS = 9;
        const SHW = HEAD_HALF_W + 0.01;
        const SH = 0.48;                    // tall spikes per reference
        const SV = 0.02;
        const SW = (SHW * 2) / NS;

        const BASE_EXT = 0.06;  // extend base into head to hide gap
        spikeShape.moveTo(-SHW, -BASE_EXT);
        spikeShape.lineTo(-SHW, 0);
        for (let i = 0; i < NS; i++) {
          const px = -SHW + (i + 0.5) * SW;
          const nx = -SHW + (i + 1) * SW;
          spikeShape.lineTo(px, SH);
          spikeShape.lineTo(nx, i < NS - 1 ? SV : 0);
        }
        spikeShape.lineTo(SHW, -BASE_EXT);
        spikeShape.lineTo(-SHW, -BASE_EXT);

        const SD = FACE_Z * 2 * 0.85;  // spike depth ≈ head depth
        const spikeGeo = new THREE.ExtrudeGeometry(spikeShape, {
          depth: SD,
          bevelEnabled: false,
        });
        // Taper spike depth: full at base, thin at tips (fixes flat-block side profile)
        const spikePositions = spikeGeo.attributes.position;
        const zMid = SD / 2;
        for (let i = 0; i < spikePositions.count; i++) {
          const y = spikePositions.getY(i);
          const t = Math.max(0, Math.min(1, y / SH));
          const squeeze = 1 - t * 0.72;  // depth → 28% at tips
          const z = spikePositions.getZ(i);
          spikePositions.setZ(i, zMid + (z - zMid) * squeeze);
        }
        spikePositions.needsUpdate = true;
        spikeGeo.computeVertexNormals();

        const spikes = new THREE.Mesh(spikeGeo, skin);
        spikes.position.set(0, HEAD_Y + HH - 0.08, -SD / 2);
        bart.add(spikes);

        // ---- EYES ----
        // Large overlapping circles (per reference), flush against face
        const EYE_Y = HEAD_Y + 0.05;
        const eyeGeo = new THREE.SphereGeometry(0.21, 24, 24);

        const leftEye = new THREE.Mesh(eyeGeo, white);
        leftEye.position.set(-0.12, EYE_Y, FACE_Z - 0.04);
        leftEye.scale.set(1.02, 0.95, 0.30);
        bart.add(leftEye);

        const rightEye = new THREE.Mesh(eyeGeo, white);
        rightEye.position.set(0.12, EYE_Y, FACE_Z - 0.04);
        rightEye.scale.set(1.02, 0.95, 0.30);
        bart.add(rightEye);

        // Pupils
        const pupilGeo = new THREE.SphereGeometry(0.052, 12, 12);
        const leftPupil = new THREE.Mesh(pupilGeo, black);
        leftPupil.position.set(-0.09, EYE_Y, FACE_Z + 0.01);
        bart.add(leftPupil);
        const rightPupil = new THREE.Mesh(pupilGeo, black);
        rightPupil.position.set(0.09, EYE_Y, FACE_Z + 0.01);
        bart.add(rightPupil);

        // ---- MUZZLE / SNOUT ----
        // Very prominent protruding snout (visible from side per reference)
        const muzzleGeo = new THREE.SphereGeometry(0.25, 20, 20);
        const muzzle = new THREE.Mesh(muzzleGeo, skin);
        muzzle.scale.set(1.18, 0.64, 0.78);
        muzzle.position.set(0, HEAD_Y - 0.16, FACE_Z + 0.04);
        bart.add(muzzle);

        // ---- NOSE ----
        const noseGeo = new THREE.SphereGeometry(0.055, 12, 12);
        const nose = new THREE.Mesh(noseGeo, skin);
        nose.position.set(0, EYE_Y - 0.12, FACE_Z + 0.14);
        bart.add(nose);

        // ---- OVERBITE & MOUTH ----
        const obGeo = new THREE.SphereGeometry(0.17, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        obGeo.scale(1.05, 0.50, 0.65);
        const overbite = new THREE.Mesh(obGeo, skin);
        overbite.position.set(0, HEAD_Y - 0.22, FACE_Z + 0.08);
        overbite.rotation.x = -Math.PI / 6;
        bart.add(overbite);

        // Mouth interior — dark cavity behind lips to prevent sealed-lip look
        const mouthBagGeo = new THREE.SphereGeometry(0.14, 16, 10);
        const darkMouth = new THREE.MeshStandardMaterial({ color: 0x1a0500 });
        const mouthBag = new THREE.Mesh(mouthBagGeo, darkMouth);
        mouthBag.scale.set(1.25, 0.30, 0.45);
        mouthBag.position.set(0, HEAD_Y - 0.265, FACE_Z + 0.04);
        bart.add(mouthBag);

        // Mouth line with Bart's signature smirk (right side higher)
        const mouthCurve = new THREE.QuadraticBezierCurve3(
          new THREE.Vector3(-0.17, HEAD_Y - 0.27, FACE_Z + 0.08),
          new THREE.Vector3(0.00, HEAD_Y - 0.30, FACE_Z + 0.14),
          new THREE.Vector3(0.19, HEAD_Y - 0.23, FACE_Z + 0.08)
        );
        bart.add(new THREE.Mesh(
          new THREE.TubeGeometry(mouthCurve, 12, 0.022, 8, false), black
        ));

        // Chin
        const chinGeo = new THREE.SphereGeometry(0.11, 14, 14, 0, Math.PI * 2, 0, Math.PI / 2);
        chinGeo.scale(0.9, 0.5, 0.55);
        const chin = new THREE.Mesh(chinGeo, skin);
        chin.position.set(0, HEAD_Y - 0.34, FACE_Z + 0.02);
        chin.rotation.x = Math.PI / 3;
        bart.add(chin);

        // ---- EARS ----
        // Round ears at eye level (per reference)
        const earGeo = new THREE.SphereGeometry(0.14, 16, 16, 0, Math.PI);
        earGeo.scale(0.45, 1.0, 1.0);

        const leftEar = new THREE.Mesh(earGeo, skin);
        leftEar.position.set(-(HEAD_HALF_W + 0.02), EYE_Y - 0.06, 0);
        leftEar.rotation.y = Math.PI / 2;
        bart.add(leftEar);
        const rightEar = new THREE.Mesh(earGeo.clone(), skin);
        rightEar.position.set(HEAD_HALF_W + 0.02, EYE_Y - 0.06, 0);
        rightEar.rotation.y = -Math.PI / 2;
        bart.add(rightEar);

        // ---- NECK ----
        const neck = new THREE.Mesh(
          new THREE.CylinderGeometry(0.13, 0.15, 0.14, 16), skin
        );
        neck.position.y = 1.70;
        bart.add(neck);

        // ---- TORSO ----
        const torso = new THREE.Mesh(
          new THREE.CylinderGeometry(0.30, 0.27, 0.55, 16), shirtOrange
        );
        torso.position.y = 1.38;
        bart.add(torso);

        // ---- ARMS ----
        const SLEEVE_LEN = 0.20, ARM_LEN = 0.34;
        const ANG = Math.PI / 5;
        const sinA = Math.sin(ANG), cosA = Math.cos(ANG);
        const sleeveGeo = new THREE.CylinderGeometry(0.075, 0.08, SLEEVE_LEN, 12);
        const armGeo = new THREE.CylinderGeometry(0.055, 0.05, ARM_LEN, 10);

        function makeHand(side) {
          const hand = new THREE.Group();
          const palm = new THREE.Mesh(
            new THREE.SphereGeometry(0.07, 12, 12), skin
          );
          palm.scale.set(1, 0.85, 0.9);
          hand.add(palm);
          const fGeo = new THREE.CylinderGeometry(0.018, 0.015, 0.09, 6);
          for (let i = 0; i < 4; i++) {
            const f = new THREE.Mesh(fGeo, skin);
            const sp = (i - 1.5) * 0.033;
            f.position.set(sp, -0.08, 0.02);
            f.rotation.z = sp * 0.5;
            hand.add(f);
          }
          const tGeo = new THREE.CylinderGeometry(0.018, 0.015, 0.065, 6);
          const t = new THREE.Mesh(tGeo, skin);
          t.position.set(side * 0.055, -0.01, 0.04);
          t.rotation.z = side * 0.7;
          hand.add(t);
          return hand;
        }

        // Left arm (hierarchical rig for animation)
        const leftArmPivot = new THREE.Group();
        leftArmPivot.position.set(-0.32, 1.56, 0);
        leftArmPivot.rotation.z = -ANG;
        bart.add(leftArmPivot);

        const lShoulderBall = new THREE.Mesh(
          new THREE.SphereGeometry(0.085, 12, 12), shirtOrange
        );
        leftArmPivot.add(lShoulderBall);

        const lSleeve = new THREE.Mesh(sleeveGeo.clone(), shirtOrange);
        lSleeve.position.set(0, -SLEEVE_LEN / 2, 0);
        leftArmPivot.add(lSleeve);

        const leftElbowPivot = new THREE.Group();
        leftElbowPivot.position.set(0, -SLEEVE_LEN, 0);
        leftArmPivot.add(leftElbowPivot);

        const lForearm = new THREE.Mesh(armGeo.clone(), skin);
        lForearm.position.set(0, -ARM_LEN / 2, 0);
        leftElbowPivot.add(lForearm);

        const lHand = makeHand(-1);
        lHand.position.set(0, -ARM_LEN, 0);
        leftElbowPivot.add(lHand);

        // Right arm (hierarchical rig for wave animation)
        const rightArmPivot = new THREE.Group();
        rightArmPivot.position.set(0.32, 1.56, 0);
        rightArmPivot.rotation.z = ANG;
        bart.add(rightArmPivot);

        const rShoulderBall = new THREE.Mesh(
          new THREE.SphereGeometry(0.085, 12, 12), shirtOrange
        );
        rightArmPivot.add(rShoulderBall);

        const rSleeve = new THREE.Mesh(sleeveGeo.clone(), shirtOrange);
        rSleeve.position.set(0, -SLEEVE_LEN / 2, 0);
        rightArmPivot.add(rSleeve);

        const elbowPivot = new THREE.Group();
        elbowPivot.position.set(0, -SLEEVE_LEN, 0);
        rightArmPivot.add(elbowPivot);

        const rForearm = new THREE.Mesh(armGeo.clone(), skin);
        rForearm.position.set(0, -ARM_LEN / 2, 0);
        elbowPivot.add(rForearm);

        const rHand = makeHand(1);
        rHand.position.set(0, -ARM_LEN, 0);
        elbowPivot.add(rHand);

        // ---- SHORTS ----
        const shorts = new THREE.Mesh(
          new THREE.CylinderGeometry(0.28, 0.30, 0.25, 16), shortsBlue
        );
        shorts.position.y = 0.98;
        bart.add(shorts);

        // ---- LEGS (hierarchical rig for walk animation) ----
        const THIGH_LEN = 0.225, SHIN_LEN = 0.225;
        const thighGeo = new THREE.CylinderGeometry(0.075, 0.075, THIGH_LEN, 12);
        const shinGeo = new THREE.CylinderGeometry(0.075, 0.075, SHIN_LEN, 12);
        const shoeGeo = new THREE.BoxGeometry(0.17, 0.10, 0.34);

        // Left leg
        const leftHipPivot = new THREE.Group();
        leftHipPivot.position.set(-0.12, 0.855, 0);
        bart.add(leftHipPivot);

        const lThigh = new THREE.Mesh(thighGeo, skin);
        lThigh.position.set(0, -THIGH_LEN / 2, 0);
        leftHipPivot.add(lThigh);

        const leftKneePivot = new THREE.Group();
        leftKneePivot.position.set(0, -THIGH_LEN, 0);
        leftHipPivot.add(leftKneePivot);

        const lShin = new THREE.Mesh(shinGeo, skin);
        lShin.position.set(0, -SHIN_LEN / 2, 0);
        leftKneePivot.add(lShin);

        const lShoe = new THREE.Mesh(shoeGeo, shoesBlue);
        lShoe.position.set(0, -SHIN_LEN - 0.05, 0.06);
        leftKneePivot.add(lShoe);

        // Right leg
        const rightHipPivot = new THREE.Group();
        rightHipPivot.position.set(0.12, 0.855, 0);
        bart.add(rightHipPivot);

        const rThigh = new THREE.Mesh(thighGeo, skin);
        rThigh.position.set(0, -THIGH_LEN / 2, 0);
        rightHipPivot.add(rThigh);

        const rightKneePivot = new THREE.Group();
        rightKneePivot.position.set(0, -THIGH_LEN, 0);
        rightHipPivot.add(rightKneePivot);

        const rShin = new THREE.Mesh(shinGeo, skin);
        rShin.position.set(0, -SHIN_LEN / 2, 0);
        rightKneePivot.add(rShin);

        const rShoe = new THREE.Mesh(shoeGeo, shoesBlue);
        rShoe.position.set(0, -SHIN_LEN - 0.05, 0.06);
        rightKneePivot.add(rShoe);

        return {
          group: bart,
          leftArmPivot, leftElbowPivot, rightArmPivot, elbowPivot,
          leftHipPivot, leftKneePivot, rightHipPivot, rightKneePivot,
        };
      }

      // ========================================================
      // Scene setup (shared)
      // ========================================================
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x2a2a3e);

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dir1 = new THREE.DirectionalLight(0xffffff, 1.0);
      dir1.position.set(3, 5, 4);
      scene.add(dir1);
      const dir2 = new THREE.DirectionalLight(0xffffff, 0.4);
      dir2.position.set(-3, 3, -2);
      scene.add(dir2);

      // Ground plane
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(10, 10),
        new THREE.MeshStandardMaterial({ color: 0x3a3a4e })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = 0.33;
      scene.add(ground);

      // Grid helper for spatial reference
      const gridHelper = new THREE.GridHelper(6, 12, 0x555577, 0x333355);
      gridHelper.position.y = 0.331;
      scene.add(gridHelper);

      const {
        group: bart,
        leftArmPivot, leftElbowPivot, rightArmPivot, elbowPivot,
        leftHipPivot, leftKneePivot, rightHipPivot, rightKneePivot,
      } = buildBart();
      scene.add(bart);

      // ========================================================
      // Create view panels with individual canvases
      // ========================================================
      const CANVAS_W = 600;
      const CANVAS_H = 600;

      const grid = document.getElementById('grid');
      const viewEntries = [];

      for (const view of VIEWS) {
        const wrapper = document.createElement('div');
        wrapper.className = 'view';

        const canvas = document.createElement('canvas');
        canvas.width = CANVAS_W;
        canvas.height = CANVAS_H;
        wrapper.appendChild(canvas);

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = view.name;
        wrapper.appendChild(label);

        const p = Array.isArray(view.pos) ? view.pos : [view.pos.x, view.pos.y, view.pos.z];
        const coords = document.createElement('div');
        coords.className = 'coords';
        coords.textContent = `cam (${p.map(n => n.toFixed(1)).join(', ')})`;
        wrapper.appendChild(coords);

        grid.appendChild(wrapper);

        const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
        camera.position.set(...p);
        camera.lookAt(view.lookAt);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(CANVAS_W, CANVAS_H);
        renderer.setPixelRatio(1); // 1:1 for clean screenshots

        viewEntries.push({ view, camera, renderer, canvas });
      }

      // ========================================================
      // Render all views once (static inspection)
      // ========================================================
      function renderAll() {
        for (const { camera, renderer } of viewEntries) {
          renderer.render(scene, camera);
        }
      }
      // Walk cycle animation
      const clock = new THREE.Clock();
      const REST_Y = bart.position.y;
      const WALK_SPEED = 4;

      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        const phase = t * WALK_SPEED;

        // Base sine waves — left and right in opposition
        const lSin = Math.sin(phase);
        const rSin = Math.sin(phase + Math.PI);

        // ---- LEGS ----
        const legSwing = 0.4;
        leftHipPivot.rotation.x = lSin * legSwing;
        rightHipPivot.rotation.x = rSin * legSwing;
        // Knee bends only on forward swing (negative phase = forward)
        leftKneePivot.rotation.x = Math.max(0, -lSin) * 0.7;
        rightKneePivot.rotation.x = Math.max(0, -rSin) * 0.7;

        // ---- ARMS (counter-swing opposite to legs) ----
        // Left arm swings forward when RIGHT leg is forward, and vice versa
        const armSwing = 0.35;
        leftArmPivot.rotation.z = -0.15;  // slight outward rest angle
        leftArmPivot.rotation.x = rSin * armSwing;
        leftElbowPivot.rotation.x = Math.max(0, rSin) * 0.3;

        rightArmPivot.rotation.z = 0.15;
        rightArmPivot.rotation.x = lSin * armSwing;
        elbowPivot.rotation.x = Math.max(0, lSin) * 0.3;

        // ---- BODY BOB ----
        // Peaks twice per stride (at each mid-swing), uses 2x frequency
        bart.position.y = REST_Y + Math.abs(Math.sin(phase)) * 0.03;

        // ---- TORSO SIDE SWAY ----
        // Lean toward the planted foot
        bart.rotation.z = Math.sin(phase) * 0.03;

        // ---- HIP TWIST ----
        // Pelvis rotates with stride — left hip forward when left leg forward
        bart.rotation.y = Math.sin(phase) * 0.06;

        renderAll();
      }
      animate();

      // ========================================================
      // Download screenshots
      // ========================================================
      document.getElementById('downloadBtn').addEventListener('click', async () => {
        const btn = document.getElementById('downloadBtn');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        // Short delay so the UI updates
        await new Promise(r => setTimeout(r, 50));

        for (const { view, canvas } of viewEntries) {
          const slug = view.name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
          const link = document.createElement('a');
          link.download = `bart-${slug}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();

          // Small delay between downloads to avoid browser throttling
          await new Promise(r => setTimeout(r, 120));
        }

        btn.disabled = false;
        btn.textContent = 'Download All Screenshots';
      });
    </script>
  </body>
</html>
